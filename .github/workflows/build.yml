name: Test, build, and upload ArchitectureAnimator

on:
  push:
    branches:
      - master
      - 'release/**'
      - 'epic/**'
  pull_request:
    branches:
      - master
      - 'release/**'
      - 'epic/**'

  workflow_dispatch:

  release:
    types: [published]

permissions:
  contents: read

env:
  MAVEN_OPTS: "-Dorg.slf4j.simpleLogger.showDateTime=true -Dorg.slf4j.simpleLogger.dateTimeFormat=HH:mm:ss,SSS"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      publish-javadoc: ${{ steps.javadoc.outputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 25
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: Cache local Maven repository
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Test Javadoc publishing
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py' -v

      - name: Prepare Javadoc publication
        id: javadoc
        if: >-
          ((github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
           github.ref == 'refs/heads/master') ||
          (github.event_name == 'release' && !github.event.release.prerelease && !github.event.release.draft)
        run: python3 .github/scripts/javadoc.py prepare --output "$RUNNER_TEMP/javadoc-build.json"

      - name: Build the project and run static analysis tools.
        run: mvn --batch-mode -P=errorprone clean test install checkstyle:checkstyle pmd:check -Dactions.run.id=$GITHUB_RUN_ID -Dactions.run.number=$GITHUB_RUN_NUMBER

      - name: Build the javadocs
        if: steps.javadoc.outputs.publish == 'true'
        env:
          JAVADOC_TOP: ${{ steps.javadoc.outputs.top }}
        run: |
          mvn --batch-mode -P=docs -DskipTests "-Dtop=$JAVADOC_TOP" install antrun:run lombok:delombok javadoc:aggregate -Dactions.run.id=$GITHUB_RUN_ID -Dactions.run.number=$GITHUB_RUN_NUMBER
          cp "$RUNNER_TEMP/javadoc-build.json" target/reports/apidocs/javadoc-build.json

      - name: Upload Javadoc for publication
        if: steps.javadoc.outputs.publish == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: javadoc
          path: target/reports/apidocs
          if-no-files-found: error
          retention-days: 3

      - name: Upload AnimatedArchitecture-Spigot
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: AnimatedArchitecture-Spigot
          path: animatedarchitecture-spigot/spigot-packager/target/AnimatedArchitecture-Spigot.jar
          archive: false
          if-no-files-found: error
          compression-level: 0

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          directory: report-aggregate/target/site/jacoco-aggregate
          token: ${{ secrets.CODECOV_TOKEN }}

  publish-javadoc:
    needs: build
    if: needs.build.outputs.publish-javadoc == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: javadoc-publish
      cancel-in-progress: false
      queue: max
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download Javadoc
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: javadoc
          path: incoming-javadoc

      - name: Read the latest published versions
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: gh-pages
          path: published-site
          persist-credentials: false

      - name: Assemble documentation and version selector
        run: python3 .github/scripts/javadoc.py publish --site published-site --docs incoming-javadoc

      - name: Deploy Javadoc
        uses: JamesIves/github-pages-deploy-action@fa24774553152dd7873cd16ebd8d959b010c5445 # v4.9.0
        with:
          branch: gh-pages
          folder: published-site
          clean: true
          force: false
