name: Automatic backport action

on:
  pull_request_target:
    types: [ "labeled", "closed" ]

jobs:
  label_checker:
    name: Check labels
    runs-on: ubuntu-latest
    outputs:
      state: ${{ steps.check.outputs.label_check }}
    steps:
      - id: check
        uses: agilepathway/label-checker@2f437aed63f79871a382eb1a79101649b61f0dea # v1.6.108
        with:
          prefix_mode: true
          any_of: backport-to-
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          allow_failure: true
      - name: Print status
        shell: bash
        run: 'echo "Label detection status: ${{ steps.check.outputs.label_check }}"'

  backport:
    needs: [ label_checker ]
    name: Backport PR
    if: github.event.pull_request.merged == true && needs.label_checker.outputs.state == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Backport Action
        uses: sorenlouv/backport-github-action@8a6c0381851f43f9f1fddc7303f0e9015eb57b62 # v12.0.4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Info log
        if: ${{ success() }}
        run: cat ~/.backport/backport.info.log

      - name: Debug log
        if: ${{ failure() }}
        run: cat ~/.backport/backport.debug.log
